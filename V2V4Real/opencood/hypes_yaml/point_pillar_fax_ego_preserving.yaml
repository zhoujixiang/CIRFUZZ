name: point_pillar_fax_ego_preserving
root_dir: '/bdata3/root/v2x/Data/train'
validate_dir: '/bdata3/root/v2x/Data/val'

wild_setting:
  async: false
  async_overhead: 100
  seed: 20
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06
  transmission_speed: 27
  backbone_delay: 10

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 4
  epoches: &epoches 60
  eval_freq: 2
  save_freq: 1
  max_cav: &max_cav 2

fusion:
  core_method: 'IntermediateFusionDataset'
  args: []

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 8]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-102.4, -38.4, -5, 102.4, 38.4, 3]


data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: 'VoxelPostprocessor'
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 4
    num: &achor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: point_pillar_coop_ego
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num
    max_cav: *max_cav
    compression: 32
    backbone_fix: false
    ego_preserving:
      fusion_method: fax
      feature_dim: 256

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
    shrink_header:
      kernal_size: [3]
      stride: [2]
      padding: [1]
      dim: [256]
      input_dim: 384

    fax_fusion:
      input_dim: 256
      mlp_dim: 256
      agent_size: *max_cav
      window_size: 4
      dim_head: 32
      drop_out: 0.1
      depth: 3
      mask: true

loss:
  core_method: point_pillar_ego_consistency_loss_tune
  args:
    cls_weight: 1.0
    reg: 2.0
    ego_aux_weight: 0.5
    preserve_cls_weight: 0.2
    preserve_reg_weight: 0.2
    preserve_neg_weight: 0.1
    gate_weight: 0.01
    # 修复: 用 hybrid 策略保证正样本被保护(纯threshold下 ego 置信度<0.35,
    # protected_pos≈0, preserve_cls/reg 空转). 与 opv2v 相同的修改.
    protected_pos_strategy: hybrid
    protected_pos_topk_ratio: 0.2
    # 只让保护区域外的 gate 放开(参照 transformer/v2vnet), 避免全局压 gate
    # 导致 long-range 协作信息被门控关掉.
    gate_loss_mode: outside_protected
    gate_ego_score_thresh: 0.20
    ego_positive_thresh: 0.35
    ego_negative_thresh: 0.10
    cls_margin: 0.02
    reg_margin: 0.0
    neg_margin: 0.02

optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: cosineannealwarm
  epoches: *epoches
  warmup_lr: 2e-4
  warmup_epoches: 10
  lr_min: 2e-5
