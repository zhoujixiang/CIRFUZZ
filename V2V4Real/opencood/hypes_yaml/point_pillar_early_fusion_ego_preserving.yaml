name: point_pillar_early_fusion_ego_preserving
root_dir: '/bdata3/root/v2x/Data/train'
validate_dir: '/bdata3/root/v2x/Data/val'

yaml_parser: "load_point_pillar_params"

wild_setting:
  async: false
  async_overhead: 60
  seed: 20
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2

train_params:
  batch_size: &batch_size 4
  epoches: &epoches 60
  eval_freq: 1
  save_freq: 1

fusion:
  core_method: 'EarlyFusionDatasetEgoPreserving'
  args: []

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 8]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-140.8, -40, -5, 140.8, 40, 3]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: 'VoxelPostprocessor'
  safe_log_target: true
  safe_log_eps: 1.0e-6
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    num: &achor_num 2
    feature_stride: 4
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: point_pillar_early_ego
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num
    compression: 0
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
    shrink_header:
      kernal_size: [3]
      stride: [2]
      padding: [1]
      dim: [256]
      input_dim: 384
    ego_preserving:
      feature_dim: 256
      # bias init so gate starts open (sigmoid(1.0) ~ 0.73),
      # instead of -2.0 (sigmoid(-2.0) ~ 0.12) which suppressed fusion.
      gate_bias_init: 1.0
      # floor on the fusion gate: at least this fraction of the cooperative
      # delta always enters. Prevents the gate from collapsing to ~0
      # (ego-only), the failure mode seen in the 8_09 run.
      gate_floor: 0.2

loss:
  core_method: point_pillar_ego_consistency_loss_early
  args:
    cls_weight: 1.0
    reg: 2.0
    # safe_finite_target: true
    ego_aux_weight: 0.05
    preserve_cls_weight: 0.05
    preserve_reg_weight: 0.05
    preserve_neg_weight: 0.0
    gate_weight: 0.05
    ego_positive_thresh: 0.50
    ego_negative_thresh: 0.10
    cls_margin: 0.02
    reg_margin: 0.0
    neg_margin: 0.02
    protected_pos_strategy: threshold
    protected_pos_topk_ratio: 0.0
    gate_loss_mode: outside_protected
    gate_ego_score_thresh: 0.15

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: cosineannealwarm
  epoches: *epoches
  warmup_lr: 2e-4
  warmup_epoches: 10
  lr_min: 1e-5
