name: second_late_fusion
root_dir: '/bdata3/root/v2x/Data/train'
validate_dir: '/bdata3/root/v2x/Data/val'

yaml_parser: "load_second_params"

wild_setting:
  async: false
  async_overhead: 100
  seed: 20
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2

train_params:
  batch_size: &batch_size 4
  epoches: &epoches 30
  eval_freq: 1
  save_freq: 1

fusion:
  core_method: 'LateFusionDataset'
  args: []

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.1, 0.1, 0.1]
    max_points_per_voxel: 5
    max_voxel_train: 36000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-70.4, -40, -3, 70.4, 40, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: 'VoxelPostprocessor'
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 8
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: second_late
  args:
    batch_size: *batch_size
    lidar_range: *cav_lidar
    voxel_size: *voxel_size
    anchor_num: *anchor_num
    mean_vfe:
      num_point_features: 4
    spconv:
      num_features_in: 4
      num_features_out: 64
    map2bev:
      feature_num: 128
    ssfa:
      feature_num: 128
    head:
      num_input: 128
    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [128]
      input_dim: 128

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 20]
